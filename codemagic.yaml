workflows:
  ios-build:
    name: Crosshair iOS
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen

      - name: Generate Xcode project
        script: xcodegen generate

      - name: Build unsigned app
        script: |
          xcodebuild \
            -project Crosshair.xcodeproj \
            -scheme Crosshair \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        script: |
          APP_PATH=$(find "$HOME/Library/Developer/Xcode/DerivedData" -path "*/Build/Products/Release-iphoneos/Crosshair.app" | head -1)
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/Crosshair.app
          zip -r Crosshair.ipa Payload

    artifacts:
      - Crosshair.ipa
